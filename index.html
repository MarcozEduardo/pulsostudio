<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oráculo · BobArena</title>
  <style>
    body {
      background: #0a0a0f;
      color: #e4c65b;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      background: radial-gradient(circle at center, #1a1a28 0%, #0a0a0f 100%);
    }
    .card {
      padding: 40px 50px;
      background: rgba(20, 20, 30, 0.8);
      border: 2px solid #c9a227;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(201, 162, 39, 0.2);
    }
    h1 {
      font-size: 2.8rem;
      margin: 0 0 16px;
      color: #fff;
      text-shadow: 0 0 25px rgba(228, 198, 91, 0.6);
    }
    p {
      color: #a8a8b8;
      font-size: 1.2rem;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Deu certo marcão. é nóis!</h1>
    <p>🚀 Deploy automático realizado com sucesso via BobArena Server v2.0</p>
  </div>
</body>
</html>
